<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Explainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; background: #f8f9fa; }
    .tab-active { border-bottom: 2px solid #1a1a1a; color: #1a1a1a; font-weight: 500; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
    .tab-history-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 500; }
    textarea { resize: vertical; }
    .spinner { border: 2px solid #e5e7eb; border-top-color: #1a1a1a; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .drop-zone { border: 2px dashed #d1d5db; border-radius: 8px; transition: all 0.2s; }
    .drop-zone.dragover { border-color: #1a1a1a; background: #f3f4f6; }
    .drop-zone.loaded { border-color: #16a34a; background: #f0fdf4; }
    .history-item { cursor: pointer; border-radius: 6px; padding: 8px 10px; font-size: 12px; color: #374151; transition: background 0.15s; word-break: break-all; }
    .history-item:hover { background: #f3f4f6; }
    .history-item.active { background: #eff6ff; color: #2563eb; font-weight: 500; }
    .markdown h1 { font-size: 1.2em; font-weight: 600; margin: 1em 0 0.5em; }
    .markdown h2 { font-size: 1.1em; font-weight: 600; margin: 1em 0 0.4em; }
    .markdown h3 { font-size: 1em; font-weight: 600; margin: 0.8em 0 0.3em; }
    .markdown p { margin: 0.5em 0; line-height: 1.8; }
    .markdown ul { margin: 0.4em 0 0.4em 1.2em; list-style: disc; }
    .markdown ol { margin: 0.4em 0 0.4em 1.2em; list-style: decimal; }
    .markdown li { margin: 0.2em 0; line-height: 1.7; }
    .markdown code { background: #f3f4f6; padding: 1px 5px; border-radius: 3px; font-size: 0.85em; font-family: monospace; }
    .markdown pre { background: #f3f4f6; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; }
    .markdown pre code { background: none; padding: 0; }
    .markdown strong { font-weight: 600; }
    .markdown hr { border: none; border-top: 1px solid #e5e7eb; margin: 1em 0; }
  </style>
</head>
<body class="min-h-screen">

<div class="flex min-h-screen">

  <!-- サイドバー -->
  <div class="w-52 shrink-0 bg-white border-r border-gray-200 flex flex-col">
    <div class="px-4 py-4 border-b border-gray-100">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">履歴</p>
    </div>
    <div id="history-list" class="flex-1 overflow-y-auto p-2">
      <p id="history-empty" class="text-xs text-gray-400 px-2 py-3">まだ履歴はありません</p>
    </div>
    <div class="p-3 border-t border-gray-100">
      <button onclick="clearHistory()" class="w-full text-xs text-gray-400 hover:text-red-500 transition-colors py-1">
        履歴をクリア
      </button>
    </div>
  </div>

  <!-- メインエリア -->
  <div class="flex-1 p-6 overflow-y-auto">
    <div class="max-w-3xl mx-auto">

      <!-- ヘッダー -->
      <div class="mb-6">
        <h1 class="text-xl font-medium text-gray-900">AWS Explainer</h1>
        <p class="text-sm text-gray-500 mt-1">定義ファイルを貼り付けるか、JSONファイルをドロップするとAIが説明します</p>
      </div>

      <!-- 設定行 -->
      <div class="flex gap-3 mb-4 items-end">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">AIモデル</label>
          <select id="model-select" class="h-9 px-3 text-sm border border-gray-200 rounded-lg bg-white text-gray-800 focus:outline-none focus:border-gray-400">
            <option value="gemini">Gemini (Google AI)</option>
            <option value="claude">Claude (Anthropic)</option>
          </select>
        </div>
      </div>

      <!-- タブ（固定4つ） -->
      <div class="flex gap-0 border-b border-gray-200 mb-3">
        <button class="tab-btn tab-active shrink-0 px-4 py-2 text-sm" data-tab="Step Functions">Step Functions</button>
        <button class="tab-btn tab-inactive shrink-0 px-4 py-2 text-sm" data-tab="CloudFormation">CloudFormation</button>
        <button class="tab-btn tab-inactive shrink-0 px-4 py-2 text-sm" data-tab="AWS">その他</button>
        <button id="tab-history-btn" class="tab-inactive shrink-0 px-4 py-2 text-sm flex items-center gap-1.5" onclick="switchToHistoryTab(null)">
          <span class="w-1.5 h-1.5 rounded-full bg-blue-400 inline-block"></span>
          履歴
        </button>
      </div>

      <!-- 新規入力エリア -->
      <div id="input-area">
        <div
          id="drop-zone"
          class="drop-zone flex flex-col items-center justify-center gap-2 py-5 mb-3 cursor-pointer"
          onclick="document.getElementById('file-input').click()"
        >
          <svg width="24" height="24" fill="none" stroke="#9ca3af" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M12 16V8m0 0-3 3m3-3 3 3"/>
            <path d="M20 16.7A4 4 0 0 0 18 9h-1.26A8 8 0 1 0 4 15.25"/>
          </svg>
          <p id="drop-label" class="text-sm text-gray-400">JSONファイルをここにドロップ、またはクリックして選択</p>
          <input id="file-input" type="file" accept=".json,.yaml,.yml" class="hidden" onchange="handleFileSelect(event)" />
        </div>
        <div class="mb-4">
          <textarea
            id="definition-input"
            rows="10"
            class="w-full px-3 py-2.5 text-sm font-mono border border-gray-200 rounded-lg bg-gray-50 text-gray-800 focus:outline-none focus:border-gray-400 focus:bg-white transition-colors"
            placeholder='{"Comment": "My State Machine", "StartAt": "FirstState", "States": { ... }}'
          ></textarea>
        </div>
        <div class="flex gap-2 mb-6">
          <button
            id="explain-btn"
            onclick="handleExplain()"
            class="flex items-center gap-2 h-9 px-4 text-sm font-medium bg-gray-900 text-white rounded-lg hover:bg-gray-700 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
          >
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            説明を生成
          </button>
          <button onclick="clearInput()" class="h-9 px-4 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-100 transition-colors">
            クリア
          </button>
        </div>
      </div>

      <!-- 履歴表示エリア -->
      <div id="history-area" class="hidden mb-4">
        <div class="flex items-center justify-between mb-3">
          <p id="history-area-title" class="text-sm font-medium text-gray-700 truncate mr-3"></p>
          <span id="history-area-type" class="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-600 shrink-0"></span>
        </div>
      </div>

      <!-- 結果エリア -->
      <div class="border border-gray-200 rounded-xl overflow-hidden bg-white">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-gray-100 bg-gray-50">
          <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">説明</span>
          <span id="status-badge" class="hidden text-xs px-2 py-0.5 rounded-full"></span>
        </div>
        <div id="result-body" class="markdown px-4 py-4 text-sm text-gray-400 min-h-32 leading-relaxed">
          定義ファイルを貼り付けて「説明を生成」を押してください
        </div>
      </div>

      <!-- コピーボタン -->
      <div id="copy-row" class="hidden mt-2 flex justify-end">
        <button onclick="copyResult()" class="text-xs text-gray-500 hover:text-gray-800 flex items-center gap-1">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          コピー
        </button>
      </div>

    </div>
  </div>
</div>

<script>
  let currentTab = 'Step Functions';
  let currentHistoryId = null;
  let rawResultText = '';
  let currentFilename = '';

  const placeholders = {
    'Step Functions': '{"Comment": "My State Machine", "StartAt": "FirstState", "States": { ... }}',
    'CloudFormation': 'AWSTemplateFormatVersion: "2010-09-09"\nResources:\n  MyBucket:\n    Type: AWS::S3::Bucket',
    'AWS': 'CDKコード、SAMテンプレート、ECSタスク定義など'
  };

  // 入力タブに切り替え
  function switchToInputTab(tabName) {
    currentTab = tabName;
    currentHistoryId = null;

    document.getElementById('input-area').classList.remove('hidden');
    document.getElementById('history-area').classList.add('hidden');
    document.getElementById('definition-input').placeholder = placeholders[tabName] || '';

    document.querySelectorAll('.tab-btn').forEach(b => {
      b.className = b.dataset.tab === tabName
        ? b.className.replace('tab-inactive', 'tab-active')
        : b.className.replace('tab-active', 'tab-inactive');
    });

    const histBtn = document.getElementById('tab-history-btn');
    histBtn.className = histBtn.className.replace('tab-history-active', 'tab-inactive');

    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    resetResult();
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchToInputTab(btn.dataset.tab));
  });

  // 履歴タブに切り替え（idがnullなら最新を表示）
  function switchToHistoryTab(id) {
    const history = getHistory();
    if (history.length === 0) return;

    const targetId = id || history[0].id;
    const item = history.find(h => h.id === targetId);
    if (!item) return;

    currentHistoryId = targetId;

    document.getElementById('input-area').classList.add('hidden');
    document.getElementById('history-area').classList.remove('hidden');
    document.getElementById('history-area-title').textContent = item.filename;
    document.getElementById('history-area-type').textContent = item.type;

    // タブのアクティブ状態
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.className = b.className.replace('tab-active', 'tab-inactive');
    });
    const histBtn = document.getElementById('tab-history-btn');
    histBtn.className = histBtn.className.replace('tab-inactive', 'tab-history-active');

    // サイドバーのアクティブ状態
    document.querySelectorAll('.history-item').forEach(i => {
      i.classList.toggle('active', i.dataset.historyId === targetId);
    });

    // 結果表示
    rawResultText = item.result;
    const resultBody = document.getElementById('result-body');
    resultBody.className = 'markdown px-4 py-4 text-sm text-gray-800 min-h-32 leading-relaxed';
    resultBody.innerHTML = marked.parse(item.result);

    const badge = document.getElementById('status-badge');
    badge.textContent = '履歴';
    badge.className = 'text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-600';
    badge.classList.remove('hidden');
    document.getElementById('copy-row').classList.remove('hidden');
  }

  // 履歴管理
  function getHistory() {
    return JSON.parse(localStorage.getItem('aws-explainer-history') || '[]');
  }

  function saveHistory(filename, type, result) {
    const history = getHistory();
    const id = Date.now().toString();
    history.unshift({ id, filename, type, result });
    if (history.length > 20) history.pop();
    localStorage.setItem('aws-explainer-history', JSON.stringify(history));
    renderHistoryList();
    return id;
  }

  function renderHistoryList() {
    const history = getHistory();
    const list = document.getElementById('history-list');
    const empty = document.getElementById('history-empty');

    list.querySelectorAll('.history-item').forEach(el => el.remove());

    if (history.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    history.forEach(item => {
      const el = document.createElement('div');
      el.className = 'history-item';
      el.dataset.historyId = item.id;
      el.textContent = item.filename;
      el.title = item.filename;
      if (item.id === currentHistoryId) el.classList.add('active');
      el.addEventListener('click', () => switchToHistoryTab(item.id));
      list.appendChild(el);
    });
  }

  function clearHistory() {
    if (!confirm('履歴をすべて削除しますか？')) return;
    localStorage.removeItem('aws-explainer-history');
    renderHistoryList();
    switchToInputTab('Step Functions');
  }

  // ドラッグ&ドロップ
  const dropZone = document.getElementById('drop-zone');

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) loadFile(file);
  }

  function loadFile(file) {
    currentFilename = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('definition-input').value = e.target.result;
      dropZone.classList.add('loaded');
      const label = document.getElementById('drop-label');
      label.textContent = `✓ ${file.name} を読み込みました`;
      label.classList.remove('text-gray-400');
      label.classList.add('text-green-600');
    };
    reader.readAsText(file);
  }

  function clearInput() {
    document.getElementById('definition-input').value = '';
    document.getElementById('file-input').value = '';
    currentFilename = '';
    dropZone.classList.remove('loaded');
    const label = document.getElementById('drop-label');
    label.textContent = 'JSONファイルをここにドロップ、またはクリックして選択';
    label.classList.remove('text-green-600');
    label.classList.add('text-gray-400');
    resetResult();
  }

  function resetResult() {
    rawResultText = '';
    const body = document.getElementById('result-body');
    body.className = 'markdown px-4 py-4 text-sm text-gray-400 min-h-32 leading-relaxed';
    body.textContent = '定義ファイルを貼り付けて「説明を生成」を押してください';
    document.getElementById('status-badge').classList.add('hidden');
    document.getElementById('copy-row').classList.add('hidden');
  }

  function copyResult() {
    navigator.clipboard.writeText(rawResultText).then(() => {
      const btn = document.querySelector('#copy-row button');
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.innerHTML = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> コピー'; }, 2000);
    });
  }

  async function handleExplain() {
    const definition = document.getElementById('definition-input').value.trim();
    const model = document.getElementById('model-select').value;
    const resultBody = document.getElementById('result-body');
    const badge = document.getElementById('status-badge');
    const btn = document.getElementById('explain-btn');
    const copyRow = document.getElementById('copy-row');

    if (!definition) { alert('定義ファイルを貼り付けるかファイルをドロップしてください'); return; }

    btn.disabled = true;
    copyRow.classList.add('hidden');
    resultBody.className = 'markdown px-4 py-4 text-sm text-gray-500 min-h-32 leading-relaxed flex items-center gap-2';
    resultBody.innerHTML = '<span class="spinner"></span> 生成中...';
    badge.classList.add('hidden');

    try {
      const res = await fetch('/explain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ definition, type_label: currentTab, model })
      });

      const data = await res.json();

      if (data.error) {
        resultBody.className = 'markdown px-4 py-4 text-sm text-red-500 min-h-32 leading-relaxed';
        resultBody.textContent = 'エラー: ' + data.error;
        badge.textContent = 'エラー';
        badge.className = 'text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-600';
        badge.classList.remove('hidden');
      } else {
        rawResultText = data.result;
        resultBody.className = 'markdown px-4 py-4 text-sm text-gray-800 min-h-32 leading-relaxed';
        resultBody.innerHTML = marked.parse(data.result);
        badge.textContent = '完了';
        badge.className = 'text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700';
        badge.classList.remove('hidden');
        copyRow.classList.remove('hidden');

        // 履歴に保存
        const rawName = currentFilename || `${currentTab}_${new Date().toLocaleTimeString('ja-JP')}`;
        const filename = rawName.replace(/\.(json|yaml|yml)$/i, '');
        saveHistory(filename, currentTab, data.result);
      }
    } catch (err) {
      resultBody.className = 'markdown px-4 py-4 text-sm text-red-500 min-h-32 leading-relaxed';
      resultBody.textContent = 'エラー: サーバーに接続できませんでした。app.pyが起動しているか確認してください。';
      badge.textContent = 'エラー';
      badge.className = 'text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-600';
      badge.classList.remove('hidden');
    } finally {
      btn.disabled = false;
    }
  }

  // 初期化
  renderHistoryList();
</script>

</body>
</html>
